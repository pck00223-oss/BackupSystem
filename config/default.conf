# BackupSystem 默认配置（key=value，忽略 # 注释行与空行）

# 源目录 / 备份目标目录
source=
target=

# 备份模式：full（全量） / incremental（增量）
type=full

# 定时执行时间（HH:MM），留空表示手动执行
schedule=

# 筛选：扩展名（逗号分隔，可带点）
include_ext=
exclude_ext=.tmp,.log,.bak

# 筛选：仅备份/排除这些相对路径前缀
# include_path=docs
# exclude_path=temp

# 筛选：文件大小范围（支持 K/M/G 后缀，0 表示不限）
min_size=0
max_size=0

# 筛选：仅备份最近 N 天修改的文件（0 表示不限）
modified_within_days=0

# 是否跳过空文件（1/0）
skip_empty=0

# 恢复时目标已存在且内容不同：1 覆盖，0 跳过（1/0）
overwrite_restore=0
