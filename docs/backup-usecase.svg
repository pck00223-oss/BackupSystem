<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1120" viewBox="0 0 1540 1120" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrowSolid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3d4654"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1540" height="1120" fill="#ffffff"/>

  <!-- 系统边界 -->
  <rect x="300" y="70" width="1210" height="960" rx="14" fill="rgba(91,141,239,0.05)" stroke="#98a6b8" stroke-width="1.6"/>
  <text x="318" y="102" font-size="17" font-weight="700" fill="#46536b">«system» BackupSystem 数据备份系统</text>

  <!-- ================= 关系线（先画线，椭圆后覆盖端点） ================= -->

  <!-- 关联（实线）：用户 → 用例 -->
  <path d="M 185 412 L 300 412 V 225 L 465 225 V 195" fill="none" stroke="#3d4654" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
  <path d="M 185 412 L 300 412 V 385 L 834 385 V 205" fill="none" stroke="#3d4654" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
  <path d="M 185 412 L 300 412 V 470 L 834 470" fill="none" stroke="#3d4654" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
  <path d="M 185 412 L 300 412 V 745 L 825 745 V 762" fill="none" stroke="#3d4654" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
  <path d="M 185 412 L 300 412 V 755 L 460 755" fill="none" stroke="#3d4654" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
  <path d="M 185 412 L 300 412 V 400 L 1020 400 V 160 H 1230" fill="none" stroke="#3d4654" stroke-width="1.4" marker-end="url(#arrowSolid)"/>
  <path d="M 185 412 L 300 412 V 510 L 1020 510 L 1230 510 V 482" fill="none" stroke="#3d4654" stroke-width="1.4" marker-end="url(#arrowSolid)"/>

  <!-- 关联（实线）：Windows 计划任务 → 执行备份 -->
  <path d="M 185 872 L 300 872 V 225 L 465 225 V 195" fill="none" stroke="#3d4654" stroke-width="1.4" marker-end="url(#arrowSolid)"/>

  <!-- include（虚线 → 被包含用例） -->
  <path d="M 498 198 L 468 262" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#arrowDashed)"/>
  <text x="452" y="226" font-size="12" font-style="italic" fill="#2563eb">«include»</text>
  <path d="M 560 205 L 560 258" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#arrowDashed)"/>
  <text x="572" y="230" font-size="12" font-style="italic" fill="#2563eb">«include»</text>
  <path d="M 618 198 L 666 262" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#arrowDashed)"/>
  <text x="676" y="226" font-size="12" font-style="italic" fill="#2563eb">«include»</text>
  <path d="M 920 210 L 920 262" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#arrowDashed)"/>
  <text x="932" y="233" font-size="12" font-style="italic" fill="#2563eb">«include»</text>
  <path d="M 1265 198 L 1225 262" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#arrowDashed)"/>
  <text x="1230" y="226" font-size="12" font-style="italic" fill="#2563eb">«include»</text>
  <path d="M 1355 198 L 1388 262" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#arrowDashed)"/>
  <text x="1396" y="226" font-size="12" font-style="italic" fill="#2563eb">«include»</text>
  <path d="M 1265 498 L 1225 562" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#arrowDashed)"/>
  <text x="1230" y="530" font-size="12" font-style="italic" fill="#2563eb">«include»</text>
  <path d="M 1355 498 L 1388 562" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#arrowDashed)"/>
  <text x="1396" y="530" font-size="12" font-style="italic" fill="#2563eb">«include»</text>

  <!-- extend（虚线 → 被扩展用例） -->
  <path d="M 430 555 L 528 208" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#arrowDashed)"/>
  <text x="492" y="368" font-size="12" font-style="italic" fill="#2563eb">«extend»</text>
  <path d="M 690 555 L 602 208" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#arrowDashed)"/>
  <text x="600" y="368" font-size="12" font-style="italic" fill="#2563eb">«extend»</text>
  <path d="M 1080 428 L 962 208" fill="none" stroke="#2563eb" stroke-width="1.2" stroke-dasharray="7 5" marker-end="url(#arrowDashed)"/>
  <text x="1035" y="322" font-size="12" font-style="italic" fill="#2563eb">«extend»</text>

  <!-- ================= 用例（椭圆） ================= -->
  <!-- 备份组 -->
  <ellipse cx="560" cy="160" rx="95" ry="40" fill="#eef3fb" stroke="#5b8def" stroke-width="1.6"/>
  <text x="560" y="166" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2d3d">执行备份</text>
  <ellipse cx="430" cy="300" rx="100" ry="40" fill="#eef3fb" stroke="#5b8def" stroke-width="1.5"/>
  <text x="430" y="297" text-anchor="middle" font-size="13" fill="#334155">扫描目录</text>
  <text x="430" y="315" text-anchor="middle" font-size="12" fill="#64748b">（先序遍历）</text>
  <ellipse cx="560" cy="300" rx="78" ry="40" fill="#eef3fb" stroke="#5b8def" stroke-width="1.5"/>
  <text x="560" y="306" text-anchor="middle" font-size="13" fill="#334155">变更检测</text>
  <ellipse cx="690" cy="300" rx="72" ry="40" fill="#eef3fb" stroke="#5b8def" stroke-width="1.5"/>
  <text x="690" y="306" text-anchor="middle" font-size="13" fill="#334155">复制文件</text>
  <ellipse cx="430" cy="600" rx="82" ry="40" fill="#eef3fb" stroke="#5b8def" stroke-width="1.5"/>
  <text x="430" y="606" text-anchor="middle" font-size="13" fill="#334155">加密备份</text>
  <ellipse cx="690" cy="600" rx="82" ry="40" fill="#eef3fb" stroke="#5b8def" stroke-width="1.5"/>
  <text x="690" y="606" text-anchor="middle" font-size="13" fill="#334155">保留快照</text>
  <ellipse cx="560" cy="790" rx="100" ry="40" fill="#eef3fb" stroke="#5b8def" stroke-width="1.5"/>
  <text x="560" y="796" text-anchor="middle" font-size="13" fill="#334155">注册计划任务</text>

  <!-- 恢复 / 校验组 -->
  <ellipse cx="920" cy="160" rx="86" ry="40" fill="#eef3fb" stroke="#5b8def" stroke-width="1.6"/>
  <text x="920" y="166" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2d3d">恢复数据</text>
  <ellipse cx="920" cy="310" rx="72" ry="40" fill="#eef3fb" stroke="#5b8def" stroke-width="1.5"/>
  <text x="920" y="316" text-anchor="middle" font-size="13" fill="#334155">数据校验</text>
  <ellipse cx="1120" cy="460" rx="92" ry="40" fill="#eef3fb" stroke="#5b8def" stroke-width="1.5"/>
  <text x="1120" y="466" text-anchor="middle" font-size="13" fill="#334155">时间点恢复</text>
  <ellipse cx="920" cy="460" rx="86" ry="40" fill="#eef3fb" stroke="#5b8def" stroke-width="1.5"/>
  <text x="920" y="466" text-anchor="middle" font-size="13" fill="#334155">校验完整性</text>
  <ellipse cx="920" cy="790" rx="95" ry="40" fill="#eef3fb" stroke="#5b8def" stroke-width="1.5"/>
  <text x="920" y="796" text-anchor="middle" font-size="13" fill="#334155">查看历史记录</text>

  <!-- TAR 组 -->
  <ellipse cx="1310" cy="160" rx="78" ry="40" fill="#eef3fb" stroke="#5b8def" stroke-width="1.6"/>
  <text x="1310" y="166" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2d3d">TAR 打包</text>
  <ellipse cx="1210" cy="310" rx="88" ry="40" fill="#eef3fb" stroke="#5b8def" stroke-width="1.5"/>
  <text x="1210" y="316" text-anchor="middle" font-size="13" fill="#334155">硬链接识别</text>
  <ellipse cx="1420" cy="310" rx="88" ry="40" fill="#eef3fb" stroke="#5b8def" stroke-width="1.5"/>
  <text x="1420" y="316" text-anchor="middle" font-size="13" fill="#334155">符号链接记录</text>
  <ellipse cx="1310" cy="460" rx="78" ry="40" fill="#eef3fb" stroke="#5b8def" stroke-width="1.6"/>
  <text x="1310" y="466" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2d3d">TAR 解包</text>
  <ellipse cx="1210" cy="600" rx="88" ry="40" fill="#eef3fb" stroke="#5b8def" stroke-width="1.5"/>
  <text x="1210" y="606" text-anchor="middle" font-size="13" fill="#334155">重建硬链接</text>
  <ellipse cx="1420" cy="600" rx="88" ry="40" fill="#eef3fb" stroke="#5b8def" stroke-width="1.5"/>
  <text x="1420" y="606" text-anchor="middle" font-size="13" fill="#334155">重建符号链接</text>

  <!-- ================= 参与者（火柴人） ================= -->
  <!-- 用户 -->
  <g stroke="#20242c" stroke-width="2" stroke-linecap="round" fill="none">
    <circle cx="160" cy="385" r="14" fill="#fff"/>
    <line x1="160" y1="399" x2="160" y2="439"/>
    <line x1="160" y1="411" x2="136" y2="427"/>
    <line x1="160" y1="411" x2="184" y2="427"/>
    <line x1="160" y1="439" x2="142" y2="463"/>
    <line x1="160" y1="439" x2="178" y2="463"/>
  </g>
  <text x="160" y="488" text-anchor="middle" font-size="14" font-weight="600" fill="#20242c">用户</text>

  <!-- Windows 计划任务 -->
  <g stroke="#20242c" stroke-width="2" stroke-linecap="round" fill="none">
    <circle cx="160" cy="835" r="14" fill="#fff"/>
    <line x1="160" y1="849" x2="160" y2="889"/>
    <line x1="160" y1="861" x2="136" y2="877"/>
    <line x1="160" y1="861" x2="184" y2="877"/>
    <line x1="160" y1="889" x2="142" y2="913"/>
    <line x1="160" y1="889" x2="178" y2="913"/>
  </g>
  <text x="160" y="938" text-anchor="middle" font-size="13" font-weight="600" fill="#20242c">Windows 计划任务</text>

  <!-- ================= 图例 ================= -->
  <g>
    <rect x="70" y="1050" width="1400" height="58" rx="10" fill="#f6f8fb" stroke="#dfe5ee" stroke-width="1.2"/>
    <!-- 参与者 -->
    <g transform="translate(120,1068)" stroke="#20242c" stroke-width="1.8" stroke-linecap="round" fill="none">
      <circle cx="10" cy="12" r="6" fill="#fff"/>
      <line x1="10" y1="18" x2="10" y2="32"/>
      <line x1="10" y1="22" x2="1" y2="29"/>
      <line x1="10" y1="22" x2="19" y2="29"/>
      <line x1="10" y1="32" x2="3" y2="42"/>
      <line x1="10" y1="32" x2="17" y2="42"/>
    </g>
    <text x="152" y="1096" font-size="13" fill="#334155">参与者（外部触发者）</text>
    <!-- 用例 -->
    <ellipse cx="340" cy="1081" rx="42" ry="17" fill="#eef3fb" stroke="#5b8def" stroke-width="1.4"/>
    <text x="340" y="1086" text-anchor="middle" font-size="11" fill="#334155">用例</text>
    <text x="398" y="1096" font-size="13" fill="#334155">用例（系统功能）</text>
    <!-- 关联 -->
    <line x1="520" y1="1081" x2="590" y2="1081" stroke="#3d4654" stroke-width="2"/>
    <text x="610" y="1096" font-size="13" fill="#334155">关联（参与者参与用例）</text>
    <!-- include / extend -->
    <line x1="790" y1="1081" x2="870" y2="1081" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="7 5"/>
    <polygon points="870,1077 880,1081 870,1085" fill="#2563eb"/>
    <text x="892" y="1086" font-size="12" font-style="italic" fill="#2563eb">«include» / «extend»</text>
    <text x="892" y="1102" font-size="11" fill="#64748b">包含 / 扩展关系</text>
    <!-- 系统边界 -->
    <rect x="1100" y="1066" width="70" height="30" rx="5" fill="rgba(91,141,239,0.05)" stroke="#98a6b8" stroke-width="1.4"/>
    <text x="1188" y="1096" font-size="13" fill="#334155">系统边界</text>
  </g>
</svg>
